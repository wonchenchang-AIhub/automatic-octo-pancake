<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 提示詞模組庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #17171b;
    --surface2: #1e1e24;
    --border: #2a2a33;
    --accent: #7c6af7;
    --accent2: #4ecdc4;
    --accent3: #f7c06a;
    --accent4: #f76a8a;
    --accent5: #6af7a0;
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #5a5a70;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    padding: 40px 32px 0;
    max-width: 1200px;
    margin: 0 auto;
  }

  .site-title {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-family: 'DM Mono', monospace;
  }

  h1 {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    margin-top: 10px;
    color: var(--text2);
    font-size: 15px;
    font-weight: 300;
  }

  /* ── Search ── */
  .search-wrap {
    max-width: 1200px;
    margin: 28px auto 0;
    padding: 0 32px;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    transition: border-color 0.2s;
  }

  .search-box:focus-within {
    border-color: var(--accent);
  }

  .search-icon {
    color: var(--text3);
    font-size: 16px;
    flex-shrink: 0;
  }

  #search-input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    width: 100%;
  }

  #search-input::placeholder { color: var(--text3); }

  #clear-btn {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0;
    display: none;
  }

  #clear-btn:hover { color: var(--text); }

  /* ── Category Tabs ── */
  .tabs-wrap {
    max-width: 1200px;
    margin: 24px auto 0;
    padding: 0 32px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tab-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }

  .tab-btn:hover {
    border-color: var(--text3);
    color: var(--text);
  }

  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  .tab-btn .tab-icon { font-size: 16px; }

  .tab-btn .tab-count {
    background: rgba(255,255,255,0.15);
    border-radius: 100px;
    padding: 1px 7px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
  }

  .tab-btn:not(.active) .tab-count {
    background: var(--surface2);
    color: var(--text3);
  }

  /* ── Main content ── */
  main {
    max-width: 1200px;
    margin: 28px auto 60px;
    padding: 0 32px;
  }

  /* ── Category Header ── */
  .category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .category-icon {
    font-size: 28px;
    line-height: 1;
  }

  .category-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .category-desc {
    color: var(--text2);
    font-size: 13px;
    margin-top: 2px;
  }

  /* ── Sub-category section ── */
  .sub-section {
    margin-bottom: 32px;
  }

  .sub-title {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.15em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  /* ── Card Grid ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }

  /* ── Prompt Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card-header {
    padding: 16px 18px 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .card-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }

  .card-badge {
    flex-shrink: 0;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 100px;
    background: var(--surface2);
    color: var(--text3);
    border: 1px solid var(--border);
  }

  .card-desc {
    padding: 0 18px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
    min-height: 18px;
  }

  .card-preview {
    margin: 12px 18px 0;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text3);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-family: 'DM Mono', monospace;
    border: 1px solid var(--border);
  }

  .card-footer {
    padding: 12px 18px 14px;
    display: flex;
    justify-content: flex-end;
  }

  .copy-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }

  .copy-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .copy-btn.copied {
    background: var(--accent5);
    border-color: var(--accent5);
    color: #0f0f11;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transform: translateY(16px);
    transition: transform 0.2s;
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-top {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-shrink: 0;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .modal-sub {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }

  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text2);
    font-size: 18px;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .modal-close:hover {
    background: var(--accent4);
    border-color: var(--accent4);
    color: #fff;
  }

  .modal-body {
    padding: 20px 28px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-prompt {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    font-size: 13.5px;
    font-family: 'DM Mono', monospace;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .modal-actions {
    padding: 16px 28px 24px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-primary:hover { opacity: 0.85; }

  .btn-primary.copied {
    background: var(--accent5);
    color: #0f0f11;
  }

  .btn-secondary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-secondary:hover {
    border-color: var(--text3);
    color: var(--text);
  }

  /* ── Search result state ── */
  .search-results-label {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 16px;
    font-family: 'DM Mono', monospace;
  }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
    font-size: 15px;
  }

  /* ── Color accents per category ── */
  [data-cat="setup"] .card:hover { border-color: var(--accent3); }
  [data-cat="setup"] .copy-btn:hover { background: var(--accent3); border-color: var(--accent3); color: #0f0f11; }
  [data-cat="setup"] .tab-btn.active { background: var(--accent3); border-color: var(--accent3); color: #0f0f11; }

  [data-cat="research"] .card:hover { border-color: var(--accent2); }
  [data-cat="research"] .copy-btn:hover { background: var(--accent2); border-color: var(--accent2); color: #0f0f11; }

  [data-cat="image"] .card:hover { border-color: var(--accent4); }
  [data-cat="image"] .copy-btn:hover { background: var(--accent4); border-color: var(--accent4); color: #fff; }

  [data-cat="slide"] .card:hover { border-color: var(--accent); }

  [data-cat="mindset"] .card:hover { border-color: var(--accent5); }
  [data-cat="mindset"] .copy-btn:hover { background: var(--accent5); border-color: var(--accent5); color: #0f0f11; }

  /* ── Highlight search ── */
  mark {
    background: var(--accent3);
    color: #0f0f11;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 20px;
    color: var(--text3);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    border-top: 1px solid var(--border);
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    header, .search-wrap, .tabs-wrap, main { padding: 0 16px; }
    header { padding-top: 24px; }
    .cards-grid { grid-template-columns: 1fr; }
    .modal-overlay { padding: 12px; }
    .modal-top, .modal-body, .modal-actions { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="site-title">Prompt Library · 張萬權</div>
  <h1>AI 提示詞<span>模組庫</span></h1>
  <p class="subtitle">「AI 給你什麼，取決於你怎麼問它。」— Nathan Hunter</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="搜尋提示詞名稱、說明或內容...">
    <button id="clear-btn">×</button>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-cat="all">
      <span class="tab-icon">📚</span> 全部 <span class="tab-count" id="count-all">0</span>
    </button>
    <button class="tab-btn" data-cat="setup">
      <span class="tab-icon">🚀</span> 入門設定 <span class="tab-count" id="count-setup">0</span>
    </button>
    <button class="tab-btn" data-cat="research">
      <span class="tab-icon">🔍</span> 研究與分析 <span class="tab-count" id="count-research">0</span>
    </button>
    <button class="tab-btn" data-cat="image">
      <span class="tab-icon">🖼️</span> 圖片生成 <span class="tab-count" id="count-image">0</span>
    </button>
    <button class="tab-btn" data-cat="slide">
      <span class="tab-icon">📊</span> 簡報製作 <span class="tab-count" id="count-slide">0</span>
    </button>
    <button class="tab-btn" data-cat="mindset">
      <span class="tab-icon">🧠</span> 思維與職場 <span class="tab-count" id="count-mindset">0</span>
    </button>
  </div>
</div>

<main id="main-content"></main>

<footer>Built for GitHub Pages · AI Prompt Module Library</footer>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-top">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-sub" id="modal-sub"></div>
      </div>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-prompt" id="modal-prompt"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="modal-copy-btn">📋 複製提示詞</button>
      <button class="btn-secondary" id="modal-close2">關閉</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  // ── 入門設定 ──
  {
    id: 1, cat: "setup", sub: "個人化預設",
    name: "個人化預設提示詞 (1/2)",
    desc: "在 Gemini / ChatGPT / Copilot 設定中加入，讓 AI 優化你的輸入並自我評分",
    prompt: `將我的口語化提示詞進行結構優化，有利於AI解讀與精準回答，執行以下步驟：

第一步：專家優化，作為一名深耕 AI 領域的顧問，專精於提示詞優化邏輯。當我輸入「原始提示詞」時，先將其轉化為更精確、能讓模型發揮最高效能的「結構化提示詞」。如果有沒有講清楚的地方，請先不要回答我，先問我幾個問題來釐清我的需求與目的，譬如5W1H。

優化核心原則：
最有效的提示詞平均約為21個字以上。若原始提示詞過於簡短，我會務必在轉化過程中強化「背景資訊」維度，以確保回覆品質。
轉化時必須包含以下四個維度：
[角色任務]：定義專業身份與核心目標。
[背景資訊]：提供必要的情境。
[具體指令]：拆解明確的操作步驟。
[約束條件]：規定字數、格式、語氣，且一律使用「正向表述」（明確說明要做什麼）。優化完成後，我會立即依照該套優化後的指令進行答覆，產出最終內容。

第二步：內部評分，針對問題特性，請先制定一份「內部評分標準」，定義『世界一流』的答案。然後，在內部反覆修改完善，直到你的答案完全符合評分標準(10/10)，最後只向我展示最終的完美版本。`
  },
  {
    id: 2, cat: "setup", sub: "個人化預設",
    name: "個人化預設提示詞 (2/2)",
    desc: "在 Gemini / ChatGPT / Copilot 設定中加入，強化事實查核與來源標註",
    prompt: `在回答問題之前，我會先執行「內部事實查核」程序：

【證據優先】：僅依據資料庫中『確切已知』的事實回答，嚴禁使用『可能、應該、或許』等模糊推測。
【允許留白】：如果信心水準低於 90%，或資料庫中缺乏相關資訊，我會直接輸出：「【資料不足，無法確認】」。
【來源標註】：拒絕編造，如果涉及具體數據、案例或法規，我會務必列出參考來源或推論邏輯，所有案例必須真實存在，嚴禁虛構人物或數據。在文章的最末尾，必須建立一個「資料來源文獻庫」，方便我一鍵複製所有參考網址。
【數據比對】：根據上傳提供文件所製作的報告、圖表或簡報，務必重複比對兩者間中英文數字，不能不一致。
【格式要求】：使用markdown語法，繁體中文輸出。`
  },
  {
    id: 3, cat: "setup", sub: "AI工具神組合",
    name: "產業資訊全貌分析（神組合）",
    desc: "Gems 客製化大腦 + NotebookLM deep research 資料庫連動",
    prompt: `【角色定位】
你是一位專精於資訊結構化（Information Structuring）的專家，擁有能在瞬間處理海量資訊並萃取其本質的能力。你的核心原則是將讀者「最優先應理解的資訊」放在首位，協助讀者在極短時間內掌握全局。

【核心任務】
請分析用戶提供的原始素材（如：會議記錄、文章、文件、筆記等），在進行內容結構化後，產出一個能讓人「一發掌握重點」的專業輸出。

【背景資訊】
來源特徵：原始素材可能未經整理且內容冗長。
目標讀者：讀者時間有限，需要快速理解整體全貌。
資訊優先級：比起低重要度的細節，更應優先呈現與「決策」或「核心理解」直接相關的內容。
真實性原則：不進行任何推測或自行補完資訊，嚴格僅使用素材中記載的事實。

【限制條件】
精煉化：刪除冗餘資訊，僅保留核心重點。
層次感：必須體現從「宏觀」到「微觀」的邏輯順序。
字數控制：結論與要點需符合具體的行數限制。

【輸出格式】
請務必按照以下結構進行輸出：
【結論摘要】用 5 行以內的文字，總結這份素材中最關鍵的重點。

// ── App State ──
let currentCat = "all";
let searchQuery = "";

// ── Count per category ──
function updateCounts(items) {
  const cats = ["setup","research","image","slide","mindset"];
  document.getElementById("count-all").textContent = items.length;
  cats.forEach(c => {
    document.getElementById(`count-${c}`).textContent = items.filter(d => d.cat === c).length;
  });
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp(escapedQuery, 'gi'), m => `<mark>${m}</mark>`);
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getFilteredData() {
  let items = DATA;
  if (currentCat !== "all") items = items.filter(d => d.cat === currentCat);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    items = items.filter(d =>
      d.name.toLowerCase().includes(q) ||
      d.desc.toLowerCase().includes(q) ||
      d.prompt.toLowerCase().includes(q) ||
      d.sub.toLowerCase().includes(q)
    );
  }
  return items;
}

const CAT_META = {
  setup:    { icon:"🚀", label:"入門設定",  desc:"個人化預設與 AI 工具神組合，讓 AI 第一次就做對", color:"var(--accent3)" },
  research: { icon:"🔍", label:"研究與分析", desc:"從深度分析到策略報告，提煉高認知門檻的洞察", color:"var(--accent2)" },
  image:    { icon:"🖼️", label:"圖片生成",  desc:"品牌視覺與情境場景，打造一致的視覺語言", color:"var(--accent4)" },
  slide:    { icon:"📊", label:"簡報製作",  desc:"從規劃到麥肯錫風格，讓每一頁都說服力十足", color:"var(--accent)" },
  mindset:  { icon:"🧠", label:"思維與職場", desc:"問題分析、決策談判、職涯教練，全方位工作提升", color:"var(--accent5)" },
};

function renderAll() {
  const items = getFilteredData();
  updateCounts(searchQuery ? items : DATA);
  const main = document.getElementById("main-content");

  if (items.length === 0) {
    main.innerHTML = `<div class="no-results">😶 找不到「${escapeHtml(searchQuery)}」相關的提示詞</div>`;
    return;
  }

  // Group by category then sub
  let html = "";

  if (searchQuery) {
    html += `<div class="search-results-label">找到 ${items.length} 筆結果</div>`;
  }

  // Which cats to show
  const catsToShow = currentCat === "all"
    ? ["setup","research","image","slide","mindset"]
    : [currentCat];

  catsToShow.forEach(cat => {
    const catItems = items.filter(d => d.cat === cat);
    if (!catItems.length) return;

    const meta = CAT_META[cat];
    html += `<div data-cat="${cat}">`;

    if (currentCat === "all") {
      html += `<div class="category-header">
        <span class="category-icon">${meta.icon}</span>
        <div>
          <div class="category-title">${meta.label}</div>
          <div class="category-desc">${meta.desc}</div>
        </div>
      </div>`;
    }

    // Group by sub
    const subs = [...new Set(catItems.map(d => d.sub))];
    subs.forEach(sub => {
      const subItems = catItems.filter(d => d.sub === sub);
      html += `<div class="sub-section">
        <div class="sub-title">${sub}</div>
        <div class="cards-grid">`;
      subItems.forEach(item => {
        html += renderCard(item);
      });
      html += `</div></div>`;
    });

    html += `</div>`;
  });

  main.innerHTML = html;
  attachCardEvents();
}

function renderCard(item) {
  const q = searchQuery;
  const previewText = item.prompt.slice(0, 120).replace(/\n/g,' ') + "…";
  return `<div class="card" data-id="${item.id}">
    <div class="card-header">
      <div class="card-name">${highlightText(item.name, q)}</div>
      <span class="card-badge">${escapeHtml(item.sub)}</span>
    </div>
    <div class="card-desc">${highlightText(item.desc, q)}</div>
    <div class="card-preview">${highlightText(previewText, q)}</div>
    <div class="card-footer">
      <button class="copy-btn" data-id="${item.id}">📋 複製</button>
    </div>
  </div>`;
}

function attachCardEvents() {
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.copy-btn')) return;
      const id = parseInt(card.dataset.id);
      openModal(id);
    });
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      const item = DATA.find(d => d.id === id);
      copyText(item.prompt, btn, '✅ 已複製', '📋 複製');
    });
  });
}

function openModal(id) {
  const item = DATA.find(d => d.id === id);
  document.getElementById('modal-title').textContent = item.name;
  document.getElementById('modal-sub').textContent = `${CAT_META[item.cat].icon} ${CAT_META[item.cat].label} · ${item.sub}`;
  document.getElementById('modal-prompt').textContent = item.prompt;
  const copyBtn = document.getElementById('modal-copy-btn');
  copyBtn.dataset.id = id;
  copyBtn.textContent = '📋 複製提示詞';
  copyBtn.classList.remove('copied');
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function copyText(text, btn, successLabel, defaultLabel) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = successLabel;
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = defaultLabel;
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ── Events ──
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-close2').addEventListener('click', closeModal);

document.getElementById('modal-copy-btn').addEventListener('click', function() {
  const id = parseInt(this.dataset.id);
  const item = DATA.find(d => d.id === id);
  copyText(item.prompt, this, '✅ 已複製！', '📋 複製提示詞');
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    renderAll();
  });
});

const searchInput = document.getElementById('search-input');
const clearBtn = document.getElementById('clear-btn');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  clearBtn.style.display = searchQuery ? 'block' : 'none';
  renderAll();
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  clearBtn.style.display = 'none';
  renderAll();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ── Init ──
renderAll();
</script>
